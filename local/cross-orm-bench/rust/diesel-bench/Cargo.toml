[package]
name = "diesel_bench"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"

[dependencies]
diesel = { version = "2.2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
libsqlite3-sys = { version = "0.28", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
simple-process-stats = "2"
