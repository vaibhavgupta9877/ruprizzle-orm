[package]
name = "prax-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
prax-orm = { version = "0.11", default-features = false, features = ["sqlite"] }
prax-query = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple-process-stats = "2"

[workspace]
