services:
  postgres:
    image: postgres:17
    container_name: ruprizzle-bench-postgres
    environment:
      POSTGRES_USER: ruprizzle_test
      POSTGRES_PASSWORD: ruprizzle_test
      POSTGRES_DB: ruprizzle_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruprizzle_test -d ruprizzle_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mysql:
    image: mysql:8.4
    container_name: ruprizzle-bench-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ruprizzle_test
      MYSQL_USER: ruprizzle_test
      MYSQL_PASSWORD: ruprizzle_test
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
