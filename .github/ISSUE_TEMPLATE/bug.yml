name: Bug Report
description: File a bug report for ruprizzle
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the fields below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of ruprizzle are you using?
      placeholder: e.g. 0.1.1-beta.1

  - type: dropdown
    id: backend
    attributes:
      label: Database / driver backend
      options:
        - Postgres (sqlx::Any)
        - SQLite (sqlx::Any)
        - SQLite (rusqlite native)
        - Postgres (tokio-postgres native)
        - Other

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps, schema, and code that reproduce the issue.
      placeholder: |
        1. Run `ruprizzle init`
        2. Add the following schema...
        3. Run this code...
      render: markdown

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant compiler, test, or runtime output.
      render: shell
