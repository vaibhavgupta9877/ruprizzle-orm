# The single workflow that publishes to GitHub Pages.
#
# Do not add a second Pages workflow. Two workflows that both deploy to the
# `github-pages` environment race each other: they share the `pages` concurrency
# group (concurrency groups are repository-wide, not per-workflow), so one run is
# queued or cancelled, and whichever deployment lands second silently overwrites
# the first. A starter "Deploy static content to Pages" workflow was added and
# removed for exactly this reason -- it also uploaded the repository root, which
# has no index.html, so it replaced the built book with a 404.
name: Docs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Lets the site be republished without an empty commit -- needed after
  # changing a Pages setting, or to recover from a bad deployment.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          # Pinned deliberately. "latest" now resolves to the 0.5 line, which is
          # a major release the theme and book.toml have not been migrated to,
          # so an unrelated upstream release would break the docs build with no
          # change on our side. Upgrading to 0.5 is its own piece of work.
          mdbook-version: "0.4.52"
      - name: Build docs
        run: mdbook build
      # Adds per-page canonical/og:url tags, marks the duplicate print view
      # noindex, attaches FAQPage structured data, generates sitemap.xml from
      # the pages that actually exist, and copies robots.txt and llms.txt to the
      # site root. See scripts/postprocess-docs.sh.
      - name: Post-process for search and AI answer engines
        run: bash scripts/postprocess-docs.sh book
      - name: Verify SEO post-processing
        run: |
          set -euo pipefail
          test -s book/index.html
          test -s book/sitemap.xml
          test -s book/robots.txt
          test -s book/llms.txt
          # Every indexable page must carry exactly one canonical tag, one
          # meta description and one og:title — the postprocessor rewrites or
          # injects each per page, and a duplicate means it double-ran or the
          # theme started emitting its own again.
          fail=0
          while IFS= read -r page; do
            # 404 is the stub page; toc.html is the sidebar iframe (noindex
            # chrome, no content tags by design).
            case "${page#book/}" in 404.html | toc.html) continue ;; esac
            # mdBook redirect stubs carry their own canonical and are left alone.
            grep -qi 'http-equiv="refresh"' "$page" && continue
            for tag in '<link rel="canonical"' '<meta name="description"' '<meta property="og:title"'; do
              n=$(grep -c "$tag" "$page" || true)
              if [ "$n" != "1" ]; then
                echo "::error file=$page::expected 1 of '$tag', found $n"
                fail=1
              fi
            done
          done < <(find book -name '*.html')
          exit "$fail"
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  # Pull requests build and verify the book but never deploy it.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
