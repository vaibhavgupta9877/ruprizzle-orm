name: Release

on:
  push:
    tags:
      # Both spellings are accepted so a tag cut as `1.0.0-rc.1` triggers the
      # workflow just as `v1.0.0-rc.1` does. The canonical form is `v`-prefixed.
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  # Lets the whole gate be exercised without publishing. `publish` defaults to
  # false, so a manual run can never reach crates.io by accident; it has to be
  # set to the literal string `true`.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to crates.io (otherwise dry-run: gate + cargo package only)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  release:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # A tag push always publishes. A manual run publishes only when the
      # `publish` input is explicitly true, so `workflow_dispatch` is a safe
      # rehearsal of the full pipeline.
      - id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Guards that the git tag, the workspace version, and the CHANGELOG
      # heading all agree before anything is uploaded. Fails the job otherwise.
      - if: github.event_name == 'push'
        run: cargo xtask release-check --tag "${GITHUB_REF_NAME}"

      # Full verification gate — this is the same command that `harden` runs
      # plus the two native-driver feature combinations.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # `--all-targets` (not `--lib --bins --examples`) and the whole workspace:
      # the narrower form let a native-driver break in ruprizzle-migrate and in
      # test targets through the gate.
      - run: >-
          cargo clippy --workspace --all-targets
          --features ruprizzle/sqlite-rusqlite,ruprizzle-migrate/sqlite-rusqlite,ruprizzle-cli/sqlite-rusqlite,ruprizzle-testkit/sqlite-rusqlite,ruprizzle-integration-tests/sqlite-rusqlite,ruprizzle-deep-tests/sqlite-rusqlite
          -- -D warnings
      - run: >-
          cargo clippy --workspace --all-targets
          --features ruprizzle/postgres-tokio-postgres,ruprizzle-integration-tests/postgres-tokio-postgres,ruprizzle-deep-tests/postgres-tokio-postgres
          -- -D warnings
      - run: cargo test -p ruprizzle --test soak --features 'sqlite-rusqlite,ruprizzle-testkit/sqlite-rusqlite'
        env:
          RUPRIZZLE_TEST_RUSQLITE: 1
      - run: cargo xtask harden

      # Publish in dependency order. Workspace dependencies are rewritten to
      # exact versions, so `cargo publish` verification against the registry
      # would see the *previous* release until the index updates. We run the
      # full gate above instead, and use `--no-verify` here. A short pause
      # between crates gives the crates.io index time to refresh.
      # Dry-run: package every crate without uploading. Runs only on a manual
      # non-publishing invocation.
      - if: steps.mode.outputs.publish != 'true'
        run: cargo xtask release

      - if: steps.mode.outputs.publish == 'true'
        run: cargo publish -p ruprizzle-core --no-verify
      - if: steps.mode.outputs.publish == 'true'
        run: sleep 30
      - if: steps.mode.outputs.publish == 'true'
        run: cargo publish -p ruprizzle-parser --no-verify
      - if: steps.mode.outputs.publish == 'true'
        run: sleep 30
      - if: steps.mode.outputs.publish == 'true'
        run: cargo publish -p ruprizzle-dialect --no-verify
      - if: steps.mode.outputs.publish == 'true'
        run: sleep 30
      - if: steps.mode.outputs.publish == 'true'
        run: cargo publish -p ruprizzle-macros --no-verify
      - if: steps.mode.outputs.publish == 'true'
        run: sleep 30
      - if: steps.mode.outputs.publish == 'true'
        run: cargo publish -p ruprizzle-check --no-verify
      - if: steps.mode.outputs.publish == 'true'
        run: sleep 30
      - if: steps.mode.outputs.publish == 'true'
        run: cargo publish -p ruprizzle-lsp --no-verify
      - if: steps.mode.outputs.publish == 'true'
        run: sleep 30
      - if: steps.mode.outputs.publish == 'true'
        run: cargo publish -p ruprizzle --no-verify
      - if: steps.mode.outputs.publish == 'true'
        run: sleep 30
      - if: steps.mode.outputs.publish == 'true'
        run: cargo publish -p ruprizzle-migrate --no-verify
      - if: steps.mode.outputs.publish == 'true'
        run: sleep 30
      - if: steps.mode.outputs.publish == 'true'
        run: cargo publish -p ruprizzle-codegen --no-verify
      - if: steps.mode.outputs.publish == 'true'
        run: sleep 30
      - if: steps.mode.outputs.publish == 'true'
        run: cargo publish -p ruprizzle-cli --no-verify
