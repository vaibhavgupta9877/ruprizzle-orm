name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  release:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Full verification gate — this is the same command that `harden` runs
      # plus the two native-driver feature combinations.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo clippy -p ruprizzle --features sqlite-rusqlite --all-targets -- -D warnings
      - run: cargo clippy -p ruprizzle --features postgres-tokio-postgres --all-targets -- -D warnings
      - run: cargo test -p ruprizzle --features sqlite-rusqlite
      - run: cargo test -p ruprizzle --features postgres-tokio-postgres
      - run: cargo xtask harden

      # Publish in dependency order. Workspace dependencies are rewritten to
      # exact versions, so `cargo publish` verification against the registry
      # would see the *previous* release until the index updates. We run the
      # full gate above instead, and use `--no-verify` here. A short pause
      # between crates gives the crates.io index time to refresh.
      - run: cargo publish -p ruprizzle-core --no-verify
      - run: sleep 30
      - run: cargo publish -p ruprizzle-parser --no-verify
      - run: sleep 30
      - run: cargo publish -p ruprizzle-dialect --no-verify
      - run: sleep 30
      - run: cargo publish -p ruprizzle-macros --no-verify
      - run: sleep 30
      - run: cargo publish -p ruprizzle --no-verify
      - run: sleep 30
      - run: cargo publish -p ruprizzle-migrate --no-verify
      - run: sleep 30
      - run: cargo publish -p ruprizzle-codegen --no-verify
      - run: sleep 30
      - run: cargo publish -p ruprizzle-cli --no-verify
