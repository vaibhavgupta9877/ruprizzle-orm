name: mutants

on:
  schedule:
    # Run every Monday at 00:00 UTC, after the Sunday fuzz run.
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  migrate:
    name: cargo-mutants (migrate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run cargo-mutants for ruprizzle-migrate
        run: |
          cargo mutants -p ruprizzle-migrate --jobs 4 --minimum-test-timeout 5 --output local/mutants-migrate

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-migrate
          path: local/mutants-migrate/

  runtime:
    name: cargo-mutants (runtime shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run cargo-mutants for ruprizzle (shard ${{ matrix.shard }}/4)
        env:
          RUST_BACKTRACE: 0
          RUPRIZZLE_SOAK_DURATION_SECONDS: 0
        run: |
          cargo mutants -p ruprizzle --jobs 2 --minimum-test-timeout 30 --output local/mutants-runtime-shard-${{ matrix.shard }} --shard ${{ matrix.shard }}/4

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-runtime-shard-${{ matrix.shard }}
          path: local/mutants-runtime-shard-${{ matrix.shard }}/
