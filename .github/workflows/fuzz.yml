name: fuzz

on:
  schedule:
    # Run every Sunday at 00:00 UTC.
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  # Override the Windows-only shared target path from .cargo/config.toml
  # so the Linux fuzz runner uses a workspace-local target.
  CARGO_TARGET_DIR: target

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - parser
          - migrate_splitter

    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz

      - name: Run ${{ matrix.target }} fuzz target
        working-directory: ./fuzz
        # `+nightly` is required: rust-toolchain.toml pins stable, which rejects
        # the `-Zsanitizer` flags cargo-fuzz passes.
        # 4 wall-clock hours per target satisfies the W4 exit gate of
        # >=4 CPU-hours per target on a single-core runner.
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=14400

      - name: Upload fuzz corpus and artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: |
            fuzz/artifacts/
            fuzz/corpus/
