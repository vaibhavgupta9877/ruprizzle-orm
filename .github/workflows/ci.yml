name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Postgres is unavailable here on purpose: this job proves the suite is
      # green without it, which is what a contributor without Docker experiences.
      # The `integration` job below is where the databases are mandatory.
      - run: cargo test --workspace

  integration:
    name: integration (postgres + sqlite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ruprizzle
          POSTGRES_PASSWORD: ruprizzle
          POSTGRES_DB: ruprizzle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruprizzle -d ruprizzle_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      RUPRIZZLE_TEST_PG_URL: postgres://ruprizzle:ruprizzle@localhost:5432/ruprizzle_test
      # Turns "database unavailable" from a skip into a failure. Without this the
      # suite would pass green while silently testing nothing on Postgres.
      RUPRIZZLE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  generated-code:
    name: generated code compiles clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Our output is other people's source code. A warning in it is our bug and
      # must fail our build, not theirs.
      #
      # xtask runs the two #[ignore]d compile tests sequentially: the first
      # materialises all example schemas for both dialects into a throw-away
      # crate and the second clippys it under clippy::pedantic. Running both
      # tests in one `cargo test --include-ignored` invocation races on the
      # generated crate, so this job uses xtask to keep them serial.
      - run: cargo xtask examples

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: |
          set -euo pipefail
          version=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  harden:
    name: pre-release hardening
    runs-on: ubuntu-latest
    # Expensive (publish dry-runs, deny check, audits). Run on main and on
    # demand rather than on every PR.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
      - run: cargo xtask harden
