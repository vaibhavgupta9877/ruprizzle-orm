name: CI

on:
  push:
    branches: [main, dev-main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Override the Windows-only shared target path from .cargo/config.toml
  # so Linux/macOS/Windows CI runners all use a workspace-local target.
  CARGO_TARGET_DIR: target

jobs:
  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  studio:
    name: studio feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `studio` is not in `ruprizzle-cli`'s default features, so the `clippy` and
      # `test` jobs above -- neither of which passes `--features` -- never see it.
      # Roughly 1,300 lines of HTTP handlers, the SQL data-access layer and six
      # askama templates went a whole release line unlinted and untested by CI as a
      # result. See ProjectPlan/v2/ProductionReadinessV1_5.md section 4.5.
      #
      # The tests run against a temp-file SQLite database created in-process, so no
      # service container is needed here.
      - name: Clippy studio
        run: cargo clippy -p ruprizzle-cli --features studio --all-targets -- -D warnings
      - name: Test studio
        run: cargo test -p ruprizzle-cli --features studio

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Postgres is unavailable here on purpose: this job proves the suite is
      # green without it, which is what a contributor without Docker experiences,
      # and it is the only shape that works on the Windows and macOS runners.
      # The `integration` job below is where the databases are mandatory.
      - run: cargo test --workspace

  integration:
    name: integration (postgres + mysql + sqlite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ruprizzle
          POSTGRES_PASSWORD: ruprizzle
          POSTGRES_DB: ruprizzle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruprizzle -d ruprizzle_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: ruprizzle
          MYSQL_PASSWORD: ruprizzle
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ruprizzle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uruprizzle -pruprizzle"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RUPRIZZLE_TEST_PG_URL: postgres://ruprizzle:ruprizzle@localhost:5432/ruprizzle_test
      # root: the testkit creates a throwaway `rz_<uuid>` database per test,
      # which the MYSQL_USER account (granted only ruprizzle_test) cannot do.
      RUPRIZZLE_TEST_MYSQL_URL: mysql://root:root@localhost:3306/ruprizzle_test
      # Turns "database unavailable" from a skip into a failure. Without this the
      # suite would pass green while silently testing nothing on Postgres/MySQL.
      RUPRIZZLE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  feature-combination:
    name: feature matrix (${{ matrix.features }}) on ${{ matrix.db }}
    runs-on: ubuntu-latest
    # Formalises W0-03/W5-01: the three native driver paths crossed with
    # SQLite, PostgreSQL, MySQL, and the combined database run.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { features: "", db: sqlite }
          - { features: "sqlite-rusqlite", db: sqlite }
          - { features: "", db: postgres }
          - { features: "postgres-tokio-postgres", db: postgres }
          - { features: "", db: mysql }
          - { features: "sqlite-rusqlite,postgres-tokio-postgres", db: all }
          # `metrics` ships as an opt-in feature but had no job building it, so
          # nothing would have caught it rotting the way the native-driver paths
          # did. It is runtime-only, so the `-p ruprizzle` scope here is enough.
          - { features: "metrics", db: sqlite }
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ruprizzle
          POSTGRES_PASSWORD: ruprizzle
          POSTGRES_DB: ruprizzle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruprizzle -d ruprizzle_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: ruprizzle
          MYSQL_PASSWORD: ruprizzle
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ruprizzle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uruprizzle -pruprizzle"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RUPRIZZLE_TEST_PG_URL: ${{ (matrix.db == 'postgres' || matrix.db == 'all') && 'postgres://ruprizzle:ruprizzle@localhost:5432/ruprizzle_test' || '' }}
      RUPRIZZLE_TEST_MYSQL_URL: ${{ (matrix.db == 'mysql' || matrix.db == 'all') && 'mysql://root:root@localhost:3306/ruprizzle_test' || '' }}
      RUPRIZZLE_REQUIRE_DB: ${{ (matrix.db == 'postgres' || matrix.db == 'mysql' || matrix.db == 'all') && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy feature combination
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo clippy -p ruprizzle --features "${{ matrix.features }}" --all-targets -- -D warnings
          else
            cargo clippy -p ruprizzle --all-targets -- -D warnings
          fi
      - name: Test feature combination
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo test -p ruprizzle --features "${{ matrix.features }}"
          else
            cargo test -p ruprizzle
          fi

  native-driver-workspace:
    name: workspace compiles with native drivers
    runs-on: ubuntu-latest
    # The feature matrix above is scoped to `-p ruprizzle`, so a native-driver
    # break anywhere else in the workspace (library code in ruprizzle-migrate,
    # integration tests, hand-written models in local crates) compiled clean in
    # CI while being broken on the feature. This job builds *every* crate, and
    # every target including tests, with each crate's own native-driver feature
    # switched on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sqlite-rusqlite
            features: >-
              ruprizzle/sqlite-rusqlite,ruprizzle-migrate/sqlite-rusqlite,ruprizzle-cli/sqlite-rusqlite,ruprizzle-testkit/sqlite-rusqlite,ruprizzle-integration-tests/sqlite-rusqlite,ruprizzle-deep-tests/sqlite-rusqlite
          - name: postgres-tokio-postgres
            features: >-
              ruprizzle/postgres-tokio-postgres,ruprizzle-integration-tests/postgres-tokio-postgres,ruprizzle-deep-tests/postgres-tokio-postgres
          - name: both native drivers
            features: >-
              ruprizzle/sqlite-rusqlite,ruprizzle-migrate/sqlite-rusqlite,ruprizzle-cli/sqlite-rusqlite,ruprizzle-testkit/sqlite-rusqlite,ruprizzle-integration-tests/sqlite-rusqlite,ruprizzle-deep-tests/sqlite-rusqlite,ruprizzle/postgres-tokio-postgres,ruprizzle-integration-tests/postgres-tokio-postgres,ruprizzle-deep-tests/postgres-tokio-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings
      # Compiling is not enough: the native pool deadlocked on an exhausted
      # pool, which only a run catches. `timeout-minutes` turns any future
      # deadlock into a failed job instead of a wedged runner.
      - name: Test workspace with native drivers
        timeout-minutes: 30
        env:
          RUPRIZZLE_TEST_RUSQLITE: 1
        run: cargo test --workspace --features "${{ matrix.features }}" -- --skip soak

  generated-code:
    name: generated code compiles clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Our output is other people's source code. A warning in it is our bug and
      # must fail our build, not theirs.
      #
      # xtask runs the two #[ignore]d compile tests sequentially: the first
      # materialises all example schemas for both dialects into a throw-away
      # crate and the second clippys it under clippy::pedantic. Running both
      # tests in one `cargo test --include-ignored` invocation races on the
      # generated crate, so this job uses xtask to keep them serial.
      - run: cargo xtask examples

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: |
          set -euo pipefail
          version=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--all-features` is load-bearing: without it, broken intra-doc links in
      # feature-gated code (`sqlite-rusqlite`, `postgres-tokio-postgres`,
      # `metrics`) are never compiled, and two of them reached a published
      # release. See ProjectPlan/v1/V1StableRelease.md S1-04.
      - run: cargo doc --workspace --no-deps --all-features

  deny:
    name: advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories licenses bans sources

  semver-checks:
    name: semver
    runs-on: ubuntu-latest
    # Mechanical enforcement of docs/Stability.md (W6-03): compares each published,
    # semver-covered crate's current public API against the latest version on
    # crates.io and fails if a breaking change isn't matched by an appropriate
    # version bump. ruprizzle-testkit and xtask are `publish = false` and are
    # skipped — they are explicitly out of scope for semver, per docs/Stability.md.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ONE-RELEASE EXCEPTION for 1.0.0-rc.1 -> 1.5.1. The latest published
      # version is still the RC, and the v1.1-v1.5 line makes changes the tool
      # rates as major (new variants on exhaustive enums, new fields on
      # constructible structs, #[non_exhaustive], #[doc(hidden)]). They are
      # accepted as RC -> stable changes and documented, item by item with
      # before/after fixes, in docs/UpgradingFromRc1.md. `release-type: major`
      # keeps every other lint running.
      #
      # REMOVE `release-type` once `scripts/check-release-state.sh --expect 1.5.1`
      # passes: from then on 1.5.1 is the baseline and ordinary semver applies.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: ruprizzle-core, ruprizzle-dialect, ruprizzle-parser, ruprizzle-codegen, ruprizzle-migrate, ruprizzle-macros, ruprizzle-check, ruprizzle-lsp, ruprizzle
          release-type: major

  public-api:
    name: public API diff vs 1.0.0-rc.1
    runs-on: ubuntu-latest
    # `cargo semver-checks` above catches the changes it has lints for.
    # `cargo public-api` is the complementary check: it prints *every* item
    # added, changed or removed from the public surface.
    #
    # The baseline must be a version crates.io actually serves. `1.5.0` was
    # tagged but never uploaded, so diffing against it failed on the fetch.
    # `1.0.0-rc.1` is the latest published version. The job is report-only for
    # now: the v1.1-v1.5 line intentionally adds hundreds of items since rc.1,
    # and `#[doc(hidden)]` on `ruprizzle::{compile,counting,nested,decode}`
    # shows up as removals, so any `--deny` would fail on accepted changes.
    #
    # Once `scripts/check-release-state.sh --expect 1.5.1` passes, move the
    # baseline to `1.5.1` and restore `--deny=all`, so no public item moves
    # without a human reading the diff first.
    #
    # Deliberately not run against `ruprizzle-testkit` or `xtask`: both are
    # `publish = false` and out of scope for semver, per docs/Stability.md.
    strategy:
      fail-fast: false
      matrix:
        package:
          - ruprizzle-core
          - ruprizzle-dialect
          - ruprizzle-parser
          - ruprizzle-codegen
          - ruprizzle-migrate
          - ruprizzle-macros
          - ruprizzle-check
          - ruprizzle-lsp
          - ruprizzle
    steps:
      - uses: actions/checkout@v4
      # cargo-public-api builds rustdoc JSON, which is nightly-only. The crate
      # itself is built by the stable toolchain; only the doc pass needs this.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api
      - name: Diff public API against the 1.0.0-rc.1 baseline (report-only)
        run: cargo public-api -p ${{ matrix.package }} diff 1.0.0-rc.1

  feature-powerset:
    name: feature powerset (depth 2)
    runs-on: ubuntu-latest
    # The hand-written `feature-combination` matrix above covers the
    # combinations we expect people to use. This covers the ones we don't: every
    # feature on its own, and every pair, for the two crates users actually add
    # to a `Cargo.toml`. Depth 2 rather than the full powerset keeps the job
    # inside a sane runtime while still catching the usual failure -- a `cfg`
    # block that only compiles when some *other* feature happens to be on.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Feature powerset for ruprizzle
        run: cargo hack --feature-powerset --depth 2 check -p ruprizzle
      - name: Feature powerset for ruprizzle-cli
        run: cargo hack --feature-powerset --depth 2 check -p ruprizzle-cli

  harden:
    name: pre-release hardening
    runs-on: ubuntu-latest
    # Expensive (publish dry-runs, deny check, audits). Run on main and on
    # demand rather than on every PR.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
      - run: cargo xtask harden
