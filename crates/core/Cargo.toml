[package]
name        = "ruprizzle-core"
description = "Shared IR, spans, and diagnostics for the ruprizzle ORM"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
readme                 = "README.md"
documentation          = "https://docs.rs/ruprizzle-core"
keywords    = ["orm", "sql", "database", "ir", "schema"]
categories  = ["database"]

[dependencies]
indexmap   = { workspace = true }
miette     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
miette = { workspace = true, features = ["fancy"] }

# Build the published API reference with every optional feature enabled, so
# feature-gated items appear on docs.rs instead of being silently omitted.
# rustdoc enables `doc(auto_cfg)` at crate level by default, so the feature
# badges come for free and no nightly `feature(...)` gate is needed here.
# See ProjectPlan/v1/V1StableRelease.md S1-03.
[package.metadata.docs.rs]
all-features = true
