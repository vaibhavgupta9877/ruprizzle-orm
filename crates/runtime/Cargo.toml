[package]
name        = "ruprizzle"
description = "A schema-first ORM for Rust: typed queries, relations, and automatic migrations"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
readme                 = "README.md"
documentation          = "https://docs.rs/ruprizzle"
keywords    = ["orm", "sql", "database", "postgres", "sqlite"]
categories  = ["database"]

[dependencies]
ruprizzle-core    = { workspace = true }
ruprizzle-dialect = { workspace = true }
ruprizzle-macros  = { workspace = true }
ruprizzle-check   = { workspace = true }
chrono            = { workspace = true }
futures-core      = "0.3"
futures-util      = { version = "0.3", default-features = false, features = ["std", "alloc"] }
rust_decimal      = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
sqlx              = { workspace = true, features = ["any", "postgres", "sqlite", "mysql"] }
rusqlite          = { version = "0.32", optional = true }
bytes             = { version = "1", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres    = { version = "0.7", default-features = false, features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"], optional = true }
thiserror         = { workspace = true }
tracing            = { version = "0.1", default-features = false, features = ["std"] }
metrics           = { version = "0.24", default-features = false, optional = true }
# Only for `sync::Mutex`, whose guard is `Send` across an await. The std guard
# is not, which makes `Executor`'s boxed futures un-`Send`. sqlx already pulls
# tokio in via `runtime-tokio`, so this adds no new dependency to the tree.
tokio             = { version = "1", default-features = false, features = ["sync"] }
uuid              = { workspace = true }

[features]
default = []
sqlite-rusqlite = ["dep:rusqlite", "rusqlite/bundled"]
postgres-tokio-postgres = ["dep:bytes", "dep:deadpool-postgres", "dep:tokio-postgres", "rust_decimal/db-tokio-postgres"]
metrics = ["dep:metrics"]

[dev-dependencies]
tokio             = { workspace = true }
tempfile          = { workspace = true }
insta             = { workspace = true }
sqlx-core         = { version = "0.8", default-features = false, features = ["any"] }
trybuild          = "1"
futures-util      = "0.3"
criterion         = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
simple-process-stats = "2"
ruprizzle-testkit = { path = "../testkit" }

[[example]]
name = "perrow"
required-features = ["sqlite-rusqlite"]

[[example]]
name = "blocking_floor"
required-features = ["sqlite-rusqlite"]

[[example]]
name = "concurrency"
required-features = ["sqlite-rusqlite"]

[[bench]]
name    = "query_construction"
harness = false

[[bench]]
name    = "end_to_end"
harness = false

[[bench]]
name    = "concurrency"
harness = false

# Build the published API reference with every optional feature enabled, so
# feature-gated items appear on docs.rs instead of being silently omitted.
# rustdoc enables `doc(auto_cfg)` at crate level by default, so the feature
# badges come for free and no nightly `feature(...)` gate is needed here.
# See ProjectPlan/v1/V1StableRelease.md S1-03.
[package.metadata.docs.rs]
all-features = true
