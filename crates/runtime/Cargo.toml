[package]
name        = "ruprizzle"
description = "A schema-first ORM for Rust: typed queries, relations, and automatic migrations"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
keywords    = ["orm", "sql", "database"]
categories  = ["database"]

[dependencies]
ruprizzle-core    = { workspace = true }
ruprizzle-dialect = { workspace = true }
ruprizzle-macros  = { workspace = true }
chrono            = { workspace = true }
rust_decimal      = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
sqlx              = { workspace = true, features = ["any", "postgres", "sqlite"] }
thiserror         = { workspace = true }
uuid              = { workspace = true }

[dev-dependencies]
tokio             = { workspace = true }
tempfile          = { workspace = true }
trybuild          = "1"
