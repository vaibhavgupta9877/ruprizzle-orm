[package]
name        = "ruprizzle"
description = "A schema-first ORM for Rust: typed queries, relations, and automatic migrations"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
readme                 = "README.md"
documentation          = "https://docs.rs/ruprizzle"
keywords    = ["orm", "sql", "database", "postgres", "sqlite"]
categories  = ["database"]

[dependencies]
ruprizzle-core    = { workspace = true }
ruprizzle-dialect = { workspace = true }
ruprizzle-macros  = { workspace = true }
chrono            = { workspace = true }
futures-core      = "0.3"
rust_decimal      = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
sqlx              = { workspace = true, features = ["any", "postgres", "sqlite"] }
rusqlite          = { version = "0.32", optional = true }
thiserror         = { workspace = true }
tracing            = { version = "0.1", default-features = false, features = ["std"] }
# Only for `sync::Mutex`, whose guard is `Send` across an await. The std guard
# is not, which makes `Executor`'s boxed futures un-`Send`. sqlx already pulls
# tokio in via `runtime-tokio`, so this adds no new dependency to the tree.
tokio             = { version = "1", default-features = false, features = ["sync"] }
uuid              = { workspace = true }

[features]
default = []
sqlite-rusqlite = ["dep:rusqlite", "rusqlite/bundled"]

[dev-dependencies]
tokio             = { workspace = true }
tempfile          = { workspace = true }
trybuild          = "1"
futures-util      = "0.3"
criterion         = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[[example]]
name = "perrow"
required-features = ["sqlite-rusqlite"]

[[example]]
name = "blocking_floor"
required-features = ["sqlite-rusqlite"]

[[example]]
name = "concurrency"
required-features = ["sqlite-rusqlite"]

[[bench]]
name    = "query_construction"
harness = false

[[bench]]
name    = "end_to_end"
harness = false
