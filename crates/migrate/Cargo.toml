[package]
name        = "ruprizzle-migrate"
description = "Schema diffing and migration engine for the ruprizzle ORM"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
readme                 = "README.md"
documentation          = "https://docs.rs/ruprizzle-migrate"
keywords    = ["orm", "sql", "database", "migrations", "schema"]
categories  = ["database"]

[features]
sqlite-rusqlite = ["ruprizzle/sqlite-rusqlite"]
metrics = ["ruprizzle/metrics"]

[dependencies]
ruprizzle         = { workspace = true }
ruprizzle-core    = { workspace = true }
ruprizzle-dialect = { workspace = true }
ruprizzle-parser  = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
sha2              = { workspace = true }
chrono            = { workspace = true }
sqlx              = { workspace = true, features = ["any", "postgres", "sqlite", "mysql"] }
tracing            = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1"
tokio    = { workspace = true }
tempfile = { workspace = true }
ruprizzle-testkit = { path = "../testkit" }


# Build the published API reference with every optional feature enabled, so
# feature-gated items appear on docs.rs instead of being silently omitted.
# rustdoc enables `doc(auto_cfg)` at crate level by default, so the feature
# badges come for free and no nightly `feature(...)` gate is needed here.
# See ProjectPlan/v1/V1StableRelease.md S1-03.
[package.metadata.docs.rs]
all-features = true
