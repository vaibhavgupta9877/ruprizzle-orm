[package]
name        = "ruprizzle-neon"
description = "In-memory Neon serverless Postgres test double for the ruprizzle ORM (no network I/O; unpublished)"
# Not published: this crate is an in-memory test double, not a working
# database adapter. See ProjectPlan/v2/ProductionReadinessV1_5.md section 4.1.
publish     = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
readme                 = "README.md"
keywords    = ["orm", "neon", "postgres", "serverless", "websocket"]
categories  = ["database"]

[dependencies]
ruprizzle         = { workspace = true }
ruprizzle-core    = { workspace = true }
ruprizzle-dialect = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
tokio             = { workspace = true }
futures-core      = "0.3"
futures-util      = { version = "0.3", default-features = false, features = ["std", "alloc"] }

[dev-dependencies]
tokio             = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
