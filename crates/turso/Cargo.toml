[package]
name        = "ruprizzle-turso"
description = "Turso / libSQL adapter for the ruprizzle ORM, over the Hrana HTTP protocol"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
documentation          = "https://docs.rs/ruprizzle-turso"
readme                 = "README.md"
keywords    = ["orm", "turso", "libsql", "sqlite", "edge"]
categories  = ["database"]

[dependencies]
ruprizzle         = { workspace = true }
ruprizzle-dialect = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
reqwest           = { workspace = true }
base64            = { workspace = true }
futures-core      = "0.3"
futures-util      = { version = "0.3", default-features = false, features = ["std", "alloc"] }

[dev-dependencies]
tokio             = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }

[package.metadata.docs.rs]
all-features = true
