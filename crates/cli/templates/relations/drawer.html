<div class="drawer-backdrop" data-close-drawer></div>
<div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="drawer-header">
    <div>
      <div class="drawer-kicker">Related record</div>
      <h3 id="drawer-title" class="drawer-title">{{ target_model }} <span class="drawer-id">#{{ target_id }}</span></h3>
    </div>
    <button type="button" class="btn btn-secondary btn-sm" data-close-drawer aria-label="Close">✕</button>
  </div>

  <div class="drawer-body">
    {% match error %}{% when Some with (message) %}
    <div class="notice notice-error"><div class="notice-body">{{ message }}</div></div>
    {% when None %}{% endmatch %}
    {% if !fields.is_empty() %}
    <dl class="record-list">
      {% for field in fields %}
      <div class="record-row">
        <dt>{{ field.name }}</dt>
        <dd>{{ field.value }}</dd>
      </div>
      {% endfor %}
    </dl>
    {% endif %}

    <div class="drawer-footer">
      <a href="/studio/models/{{ target_model|urlencode_strict }}" class="btn btn-primary btn-sm">Open {{ target_model }} table →</a>
    </div>
  </div>
</div>
