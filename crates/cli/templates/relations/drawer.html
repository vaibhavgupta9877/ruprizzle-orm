<div class="drawer-backdrop" onclick="document.getElementById('relation-drawer').innerHTML = ''"></div>
<div class="drawer">
  <div class="drawer-header">
    <div>
      <div style="font-size:11px; color:#a1a1aa; text-transform:uppercase; font-weight:600;">Relation Inspector</div>
      <h3 style="color:#fff; font-size:16px; font-weight:600;">{{ target_model }} <span style="color:#6366f1;">#{{ target_id }}</span></h3>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="document.getElementById('relation-drawer').innerHTML = ''">✕</button>
  </div>

  <div class="drawer-body">
    <div class="card" style="padding:16px;">
      <div style="font-size:12px; color:#a1a1aa; margin-bottom:12px; font-weight:500;">Record Attributes</div>
      {% match error %}{% when Some with (message) %}
      <div style="background:#1c1416; border:1px solid #f43f5e; border-radius:8px; padding:12px; color:#fda4af; font-size:12px;">
        {{ message }}
      </div>
      {% when None %}{% endmatch %}
      <div style="display:flex; flex-direction:column; gap:8px;">
        {% for field in fields %}
        <div style="display:flex; justify-content:space-between; font-size:13px; border-bottom:1px solid #27272a; padding-bottom:6px;">
          <span style="color:#a1a1aa;">{{ field.name }}</span>
          <span style="color:#fff; font-family:monospace;">{{ field.value }}</span>
        </div>
        {% endfor %}
      </div>
    </div>

    <div style="margin-top:auto; display:flex; justify-content:flex-end;">
      <a href="/studio/models/{{ target_model }}" class="btn btn-primary btn-sm">Open Full Table View →</a>
    </div>
  </div>
</div>
