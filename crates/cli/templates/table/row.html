{% let row_id = row.id.as_str() %}
<tr>
  {% for cell in row.cells %}
  {% include "table/_cell.html" %}
  {% endfor %}
  {% if allow_writes %}
  <td class="row-actions">
    <button type="button" class="btn btn-ghost-danger btn-icon" aria-label="Delete row {{ row.id }}" title="Delete row"
            hx-delete="/studio/models/{{ current_model|urlencode_strict }}/rows/{{ row.id|urlencode_strict }}"
            hx-target="closest tr" hx-swap="outerHTML swap:150ms"
            hx-confirm="Delete this {{ current_model }} row ({{ row.id }})? This cannot be undone.">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M6.5 4V2.5h3V4M5 4l.6 9h4.8L11 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </td>
  {% endif %}
</tr>
