[package]
name        = "ruprizzle-cli"
description = "Command-line interface for the ruprizzle ORM"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
readme                 = "README.md"
documentation          = "https://docs.rs/ruprizzle-cli"
keywords    = ["orm", "sql", "database", "cli", "migrations"]
categories  = ["database", "command-line-utilities"]

[[bin]]
name = "ruprizzle"
path = "src/main.rs"
doc = false

[features]
default = []
sqlite-rusqlite = ["ruprizzle-migrate/sqlite-rusqlite"]
studio = [
    "dep:axum",
    "dep:askama",
    "dep:rust-embed",
    "dep:mime_guess",
    "dep:opener",
    "dep:tower",
    "dep:tower-http",
    "dep:serde",
]

[dependencies]
ruprizzle         = { workspace = true }
ruprizzle-core    = { workspace = true }
ruprizzle-parser  = { workspace = true }
ruprizzle-codegen = { workspace = true }
ruprizzle-migrate = { workspace = true }
ruprizzle-dialect = { workspace = true }
ruprizzle-lsp     = { workspace = true }
ruprizzle-check   = { workspace = true }
clap              = { workspace = true }
dotenvy           = { workspace = true }

miette            = { workspace = true, features = ["fancy"] }
notify            = { workspace = true }
tokio             = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
serde_json        = { workspace = true }
indexmap          = { workspace = true }
serde             = { workspace = true, optional = true }
axum              = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "matched-path", "original-uri", "query", "form"], optional = true }
askama            = { version = "0.12", optional = true }
rust-embed        = { version = "8.5", features = ["mime-guess"], optional = true }
mime_guess        = { version = "2.0", optional = true }
opener            = { version = "0.7", optional = true }
tower             = { version = "0.5", optional = true }
tower-http        = { version = "0.6", features = ["cors", "trace"], optional = true }

[dev-dependencies]
http-body-util    = "0.1"
tower             = { version = "0.5", features = ["util"] }
tempfile          = { workspace = true }

# Build the published API reference with every optional feature enabled, so
# feature-gated items appear on docs.rs instead of being silently omitted.
# rustdoc enables `doc(auto_cfg)` at crate level by default, so the feature
# badges come for free and no nightly `feature(...)` gate is needed here.
# See ProjectPlan/v1/V1StableRelease.md S1-03.
[package.metadata.docs.rs]
all-features = true
