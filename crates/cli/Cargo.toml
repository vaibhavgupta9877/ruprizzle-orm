[package]
name        = "ruprizzle-cli"
description = "Command-line interface for the ruprizzle ORM"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
readme                 = "README.md"
documentation          = "https://docs.rs/ruprizzle-cli"
keywords    = ["orm", "sql", "database", "cli", "migrations"]
categories  = ["database", "command-line-utilities"]

[[bin]]
name = "ruprizzle"
path = "src/main.rs"

[features]
default = []
sqlite-rusqlite = ["ruprizzle-migrate/sqlite-rusqlite"]

[dependencies]
ruprizzle         = { workspace = true }
ruprizzle-core    = { workspace = true }
ruprizzle-parser  = { workspace = true }
ruprizzle-codegen = { workspace = true }
ruprizzle-migrate = { workspace = true }
ruprizzle-dialect = { workspace = true }
ruprizzle-lsp     = { workspace = true }
ruprizzle-check   = { workspace = true }
clap              = { workspace = true }
dotenvy           = { workspace = true }

miette            = { workspace = true, features = ["fancy"] }
notify            = { workspace = true }
tokio             = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
serde_json        = { workspace = true }
indexmap          = { workspace = true }
