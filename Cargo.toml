[workspace]
members = ["crates/*", "tests/integration", "local/deep-tests", "xtask"]
resolver = "3"

[workspace.package]
version      = "1.5.1"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/vaibhavgupta9877/ruprizzle-orm"
homepage     = "https://vaibhavgupta9877.github.io/ruprizzle-orm"
authors      = ["Vaibhav Gupta <vaibhavgupta9877@gmail.com>"]

[workspace.dependencies]
# --- internal ---
ruprizzle-core    = { path = "crates/core",    version = "1.5.1" }
ruprizzle-dialect = { path = "crates/dialect", version = "1.5.1" }
ruprizzle-parser  = { path = "crates/parser",  version = "1.5.1" }
ruprizzle-codegen = { path = "crates/codegen", version = "1.5.1" }
ruprizzle-migrate = { path = "crates/migrate", version = "1.5.1" }
ruprizzle-macros  = { path = "crates/macros",  version = "1.5.1" }
ruprizzle         = { path = "crates/runtime", version = "1.5.1" }
ruprizzle-testkit = { path = "crates/testkit", version = "1.5.1" }
ruprizzle-lsp     = { path = "crates/lsp",     version = "1.5.1" }
ruprizzle-check   = { path = "crates/check",   version = "1.5.1" }
ruprizzle-turso   = { path = "crates/turso",   version = "1.5.1" }
ruprizzle-d1      = { path = "crates/d1",      version = "1.5.1" }

# --- external ---
pest         = "2.8"
pest_derive  = "2.8"
sqlx         = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "postgres", "sqlite", "mysql", "macros", "uuid", "chrono", "json", "rust_decimal"] }
chrono       = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", default-features = false, features = ["serde"] }
thiserror    = "2"
miette       = "7"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
proc-macro2  = "1"
quote        = "1"
syn          = { version = "2", features = ["full"] }
prettyplease = "0.2"
clap         = { version = "4", features = ["derive", "env"] }
tokio        = { version = "1", features = ["macros", "rt-multi-thread"] }
indexmap     = { version = "2", features = ["serde"] }
sha2         = "0.11"
uuid         = { version = "1", features = ["v4", "serde"] }
tempfile     = "3"
insta        = { version = "1", features = ["json"] }
dotenvy      = "0.15"
notify       = "8"
walkdir      = "2"
criterion    = "0.8"
tower-lsp    = { version = "0.20", default-features = false, features = ["runtime-tokio"] }
# The edge adapters speak HTTP. `rustls` rather than the platform TLS stack so a
# `cargo build` needs no OpenSSL headers on any of the three release targets.
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset"] }
base64       = "0.22"

[profile.dev]
# Codegen output and sqlx make debug builds heavy; this trims link time without
# hurting debuggability of our own crates.
debug = 1
# Emit debuginfo as separate .o/.dwo files instead of copying it into the final
# binary at link time.  On Linux this is the cheapest link-time win available
# and it keeps incremental relinks from rewriting hundreds of MB per build.
split-debuginfo = "unpacked"

# Dependencies are compiled once and then never stepped through; carrying their
# debuginfo is what makes a `target/` directory reach double-digit gigabytes.
# Dropping it shrinks the directory several-fold and shortens every link,
# without touching the debuggability of the workspace crates above.
[profile.dev.package."*"]
debug = false

[profile.test]
debug = 1
split-debuginfo = "unpacked"

[profile.test.package."*"]
debug = false

[profile.release]
# Tuned for the cross-ORM benchmark and for production builds: thin LTO and a
# single codegen unit give the compiler enough freedom to inline across the
# workspace without the multi-minute cost of full LTO.
lto = "thin"
codegen-units = 1
