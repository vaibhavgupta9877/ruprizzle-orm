# `cargo-deny` configuration for pre-release hardening.

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[output]
feature-depth = 1

[advisories]
db-path = ".cargo/deny/advisories"
db-urls = ["https://github.com/rustsec/advisory-db"]
# We are an alpha; warn on any known advisory rather than fail.
unsound = "warn"
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
name = "ring"
version = "*"
allow = ["OpenSSL"]

[bans]
# We do not want two versions of heavy crates if it can be avoided.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
required-git-spec = "tag"
