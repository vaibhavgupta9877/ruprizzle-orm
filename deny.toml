# `cargo-deny` configuration for pre-release hardening.

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[output]
feature-depth = 1

[advisories]
db-path = ".cargo/deny/advisories"
db-urls = ["https://github.com/rustsec/advisory-db"]
# We are an alpha; warn on yanked crates, but do not fail on unsound
# advisories (cargo-deny no longer supports a "warn" level for them).
unmaintained = "workspace"
unsound = "none"
yanked = "warn"
# `rsa 0.9.10` (via `sqlx-mysql`) has RUSTSEC-2023-0071. No patched release is
# available as of 2026-08-17. The side-channel only affects MySQL's
# caching_sha2_password RSA key exchange, which is not the default auth method
# on most modern deployments (TLS or unix_socket is preferred). Revisit before
# declaring MySQL support production-ready in v1.
# `libsqlite3-sys` 0.30.1 (via `sqlx-sqlite` 0.8.6 and `rusqlite` 0.32) bundles
# SQLite before 3.54.0, RUSTSEC-2026-0459. The patched `libsqlite3-sys` 0.39 needs
# `rusqlite` 0.41 (Rust 1.89), and `sqlx-sqlite` 0.8 cannot take it at all, so the
# fix is blocked on the sqlx 0.9 upgrade, which is deferred to 2.0.0 (see
# docs/Stability.md). Exposure: only a process that opens a database together
# with a `-wal` file an untrusted party wrote. Users who open untrusted SQLite
# files should use a system SQLite build. Revisit when sqlx moves to 0.9.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "transitive via sqlx-mysql; no patched release available yet" },
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite via libsqlite3-sys 0.30; patched only in 0.39, blocked on sqlx 0.9 (2.0.0). Exposure requires an attacker-written -wal file." },
    { id = "RUSTSEC-2026-0385", reason = "ctutils 0.4.2 via digest (non-constant-time mask generation). Patched in ctutils >= 0.4.4, but those declare rust-version 1.87 and the workspace MSRV is 1.85. Revisit when the MSRV is raised to 1.87 or later (see the v2.0 plan)." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # `webpki-roots`, which is Mozilla's CA root store rather than code, and is
    # licensed under a permissive *data* licence. It reaches us through `rustls`,
    # which the edge adapters use so that a build needs no OpenSSL headers.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# We do not want two versions of heavy crates if it can be avoided.
multiple-versions = "warn"
wildcards = "deny"
# Path and git dev-dependencies (like the internal ruprizzle-testkit) use a
# wildcard version by design; this option keeps `wildcards = deny` without
# flagging those.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
required-git-spec = "tag"
