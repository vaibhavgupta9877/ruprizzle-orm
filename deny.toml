# `cargo-deny` configuration for pre-release hardening.

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[output]
feature-depth = 1

[advisories]
db-path = ".cargo/deny/advisories"
db-urls = ["https://github.com/rustsec/advisory-db"]
# We are an alpha; warn on yanked crates, but do not fail on unsound
# advisories (cargo-deny no longer supports a "warn" level for them).
unmaintained = "workspace"
unsound = "none"
yanked = "warn"
# `rsa 0.9.10` (via `sqlx-mysql`) has RUSTSEC-2023-0071. No patched release is
# available as of 2026-08-17. The side-channel only affects MySQL's
# caching_sha2_password RSA key exchange, which is not the default auth method
# on most modern deployments (TLS or unix_socket is preferred). Revisit before
# declaring MySQL support production-ready in v1.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "transitive via sqlx-mysql; no patched release available yet" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
name = "ring"
version = "*"
allow = ["OpenSSL"]

[bans]
# We do not want two versions of heavy crates if it can be avoided.
multiple-versions = "warn"
wildcards = "deny"
# Path and git dev-dependencies (like the internal ruprizzle-testkit) use a
# wildcard version by design; this option keeps `wildcards = deny` without
# flagging those.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
required-git-spec = "tag"
